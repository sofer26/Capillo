
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>NEON DRAW | Administración</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080b16;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #111827;
      border: 1px solid #26334d;
      border-radius: 18px;
      box-shadow: 0 0 30px #00e5ff12;
    }
    .logo {
      color: #00e5ff;
      text-align: center;
      letter-spacing: 5px;
      font-weight: bold;
    }
    h1 { text-align: center; font-size: 25px; }
    p { color: #aab6ca; text-align: center; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #080b16;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #00d9f5;
      color: #07111b;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .panel { display: none; }
    .panel button { background: #26334d; color: white; }
    .status {
      padding: 14px;
      border: 1px solid #00e5ff55;
      border-radius: 10px;
      color: #00e5ff;
      text-align: center;
    }
    a { color: #00e5ff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">NEON DRAW</div>

    <section id="login">
      <h1>Panel administrativo</h1>
      <p>Acceso exclusivo para administradores autorizados.</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username"
               required>

        <label for="password">Contraseña</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button id="loginButton" type="submit">
          Iniciar sesión
        </button>
      </form>
    </section>

    <section id="panel" class="panel">
      <h1>¡Bienvenido!</h1>
      <div class="status">Administrador verificado</div>
      <p id="adminEmail"></p>
      <p>NEON DRAW está en modo demostración.</p>
      <button id="logoutButton" type="button">
        Cerrar sesión
      </button>
    </section>

    <div id="message" role="status" aria-live="polite"></div>
    <p><a href="./">Volver a la página principal</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
