
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>NEON DRAW | Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080b16;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 40px 24px;
      border: 1px solid #26334d;
      border-radius: 20px;
      background: #111827;
      box-shadow: 0 0 35px #00e5ff18;
    }

    .logo {
      color: #00e5ff;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(30px, 7vw, 48px);
    }

    h1 span {
      color: #00e5ff;
    }

    p {
      color: #aab6ca;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 18px;
      border: 1px solid #00e5ff66;
      border-radius: 30px;
      color: #00e5ff;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">NEON DRAW</div>

    <h1>¡Esta laptop <span>puede ser tuya!</span></h1>

    <p>
      Estamos preparando una nueva experiencia
      de sorteos digitales.
    </p>

    <div class="status">
      MODO DEMOSTRACIÓN · NO HAY PARTICIPACIONES
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</body>
  
</html>
